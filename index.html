<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Regia GH Cocina</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --amarillo:#f4b400;
  --negro:#0f0f0f;
  --gris:#1a1a1a;
  --verde:#25d366;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:linear-gradient(180deg,#0f0f0f,#181818);
  color:white;
  overflow-x:hidden;
  padding-top:80px;  /* 👈 AGREGAR ESTA LÍNEA */
}
/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  height:80px;              /* 👈 IMPORTANTE */
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);
  padding:0 25px;           /* 👈 QUITA el padding vertical */
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}
nav h2{color:var(--amarillo);font-weight:800;}
nav a{color:white;text-decoration:none;margin-left:20px;transition:0.3s;}
nav a:hover{color:var(--amarillo);}

/* HERO */
.hero{
  height:90vh;
  background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.9)),
  url('fondo.jpeg') center/cover;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}
.hero h1{font-size:48px;color:var(--amarillo);}
.hero p{margin:20px 0;font-size:18px;opacity:0.9;}
.hero button{
  background:var(--amarillo);
  border:none;
  padding:12px 25px;
  border-radius:30px;
  font-weight:600;
  cursor:pointer;
}

/* SECCIONES */
section{padding:100px 20px;max-width:1200px;margin:auto;}
.titulo{text-align:center;color:var(--amarillo);margin-bottom:50px;font-size:32px;}

/* CARDS */
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(8px);
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
}
.card:hover{transform:translateY(-10px);}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card-content{padding:20px;}
.precio{color:var(--amarillo);font-weight:bold;margin:10px 0;}
.add-btn{
  background:var(--amarillo);
  border:none;
  padding:8px 18px;
  border-radius:25px;
  cursor:pointer;
}

/* ADMIN PANEL */
.admin-panel{
  margin-top:40px;
  background:#111;
  padding:20px;
  border-radius:15px;
}
.admin-panel input{
  padding:8px;
  margin:5px;
  border-radius:5px;
  border:none;
}
.admin-panel button{
  padding:8px 12px;
  border:none;
  border-radius:5px;
  background:var(--amarillo);
  cursor:pointer;
}

/* CARRITO */
.cart{
  position:fixed;
  top:80px;                  /* 👈 BAJAMOS EL CARRITO */
  right:-100%;
  width:350px;
  height:calc(100% - 80px);  /* 👈 AJUSTAMOS ALTURA */
  background:#111;
  padding:25px;
  transition:0.4s;
  overflow-y:auto;
}
.cart.active{right:0;}
.cart-toggle{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--amarillo);
  padding:15px;
  border-radius:50%;
  cursor:pointer;
}
.checkout-btn{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#25d366,#1ebe5d);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(37,211,102,0.4);
}

.checkout-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(37,211,102,0.6);
}
/* MAPA */
iframe{width:100%;height:350px;border:none;border-radius:20px;margin-top:20px;}
section{
  scroll-margin-top:100px;
}
</style>
</head>
<body>

<nav>
  <h2>La Regia GH Cocina</h2>
  <div>
    <a href="#menu">Menú</a>
    <a href="#ubicacion">Ubicación</a>
  </div>
</nav>

<div class="hero">
  <h1>Sabor Regio en Cada Bocado 🔥</h1>
  <p>Comida casera con auténtico sabor del norte.</p>
  <button onclick="document.getElementById('menu').scrollIntoView()">Ver Menú</button>
</div>

<section id="menu">
  <h2 class="titulo">Nuestro Menú</h2>
  <div class="menu-grid" id="menu-container"></div>


</section>

<section id="ubicacion">
  <h2 class="titulo">Ubicación</h2>
  <iframe src="https://www.google.com/maps?q=Calle+Aguascalientes+100+Col+Celestino+Gasca&output=embed"></iframe>
</section>

<div class="cart" id="cart">
  <h3>Tu Pedido</h3>
  <div id="cart-items"></div>
  <div id="total"></div>

<hr style="margin:15px 0;border:1px solid #333;">

<h4>Datos del Pedido</h4>

<label>Nombre:</label>
<input type="text" id="clienteNombre" placeholder="Tu nombre">

<label>Tipo de pedido:</label>
<select id="tipoEntrega">
  <option value="Recoger en local">Recoger en local</option>
  <option value="Envío a domicilio">Envío a domicilio</option>
</select>
<label id="direccionLabel" style="display:none;">Dirección:</label>
<input type="text" id="direccionEnvio" placeholder="Tu dirección completa" style="display:none;">

<label>Método de pago:</label>
<select id="metodoPago">
  <option value="Efectivo">Efectivo</option>
  <option value="Tarjeta">Tarjeta</option>
  <option value="Transferencia">Transferencia</option>
</select>

 <button class="checkout-btn" onclick="checkout()">
  📲 Enviar pedido por WhatsApp
</button>
</div>

<div class="cart-toggle" onclick="toggleCart()">🛒</div>

<script>
let productos=[
  {nombre:"Asado de Puerco",precio:90,imagen:"asado.jpg"},
  {nombre:"Hamburguesa Clásica",precio:90,imagen:"hamburguesa.jpg"},
  {nombre:"Tacos Pirata",precio:100,imagen:"tacos.jpg"},
  {nombre:"Discada Norteña",precio:95,imagen:"discada.jpg"},
  {nombre:"Milanesa Empanizada",precio:100,imagen:"milanesa.jpg"},
  {nombre:"Pechuga a la Plancha",precio:100,imagen:"pechuga.jpg"},
  {nombre:"Hamburguesa Doble Carne",precio:120,imagen:"doble.jpg"},
  {nombre:"Club Sandwich",precio:90,imagen:"club.jpg"},
  {nombre:"Ensalada de Pollo",precio:80,imagen:"ensalada.jpg"},
  {nombre:"Papas a la Francesa",precio:60,imagen:"papas.jpg"},

  {nombre:"Tacos de Bistec",precio:95,imagen:"bistec.jpg"},
  {nombre:"Tacos de Trompo",precio:95,imagen:"trompo.jpg"},
  {nombre:"Gringa Especial",precio:110,imagen:"gringa.jpg"},
  {nombre:"Burrito Norteño",precio:85,imagen:"burrito.jpg"},
  {nombre:"Chilaquiles Rojos",precio:85,imagen:"chilaquiles.jpg"},
  {nombre:"Chilaquiles Verdes",precio:85,imagen:"chilaquiles-verdes.jpg"},
  {nombre:"Huevos Rancheros",precio:80,imagen:"huevos.jpg"},
  {nombre:"Molletes con Carne",precio:90,imagen:"molletes.jpg"},
  {nombre:"Hot Dogs Regios",precio:70,imagen:"hotdog.jpg"},
  {nombre:"Alitas BBQ",precio:120,imagen:"alitas.jpg"},
  {nombre:"Boneless",precio:120,imagen:"boneless.jpg"},
  {nombre:"Costillas BBQ",precio:150,imagen:"costillas.jpg"},
  {nombre:"Carne Asada Plato",precio:140,imagen:"carneasada.jpg"},
  {nombre:"Nachos con Carne",precio:110,imagen:"nachos.jpg"},
  {nombre:"Quesadilla Gigante",precio:90,imagen:"quesadilla.jpg"},
  {nombre:"Torta de Asado",precio:85,imagen:"torta.jpg"},
  {nombre:"Refresco 600ml",precio:25,imagen:"refresco.jpg"},
  {nombre:"Agua Natural",precio:20,imagen:"agua.jpg"}
];
function renderMenu(){
  const container=document.getElementById("menu-container");
  container.innerHTML="";
  productos.forEach((p,i)=>{
    container.innerHTML+=`
    <div class="card">
      <img src="${p.imagen}" alt="${p.nombre}">
      <div class="card-content">
        <h3>${p.nombre}</h3>
        <div class="precio">$${p.precio}</div>
        <button class="add-btn" onclick="addToCart(${i})">Agregar</button>
        
      </div>
    </div>`;
  });
}

function agregarProducto(){
  const nombre=document.getElementById("nuevoNombre").value;
  const precio=parseInt(document.getElementById("nuevoPrecio").value);
  const imagen=document.getElementById("nuevaImagen").value;
  if(nombre && precio && imagen){
    productos.push({nombre,precio,imagen});
    renderMenu();
  }
}

function eliminarProducto(index){
  productos.splice(index,1);
  renderMenu();
}

let carrito=[];

function addToCart(index){
  const producto=productos[index];
  const existente=carrito.find(item=>item.nombre===producto.nombre);
  if(existente){existente.cantidad++;}
  else{carrito.push({...producto,cantidad:1});}
  renderCart();
}

function renderCart(){
  const items=document.getElementById("cart-items");
  const totalEl=document.getElementById("total");
  items.innerHTML="";
  let total=0;
  carrito.forEach((item,i)=>{
    total+=item.precio*item.cantidad;
    items.innerHTML+=`
    <div>
      ${item.nombre} x${item.cantidad} - $${item.precio*item.cantidad}
      <button onclick="carrito.splice(${i},1);renderCart()">Eliminar</button>
    </div>`;
  });
  totalEl.innerHTML="<strong>Total: $"+total+"</strong>";
}

function toggleCart(){
  document.getElementById("cart").classList.toggle("active");
}

function checkout(){

  const nombre = document.getElementById("clienteNombre").value.trim();
  const tipoEntrega = document.getElementById("tipoEntrega").value;
  const metodoPago = document.getElementById("metodoPago").value;
  const direccion = document.getElementById("direccionEnvio").value.trim();

  if(nombre === ""){
    alert("Por favor ingresa tu nombre");
    return;
  }

  if(carrito.length === 0){
    alert("Tu carrito está vacío");
    return;
  }

  if(tipoEntrega === "Envío a domicilio" && direccion === ""){
    alert("Por favor ingresa tu dirección de envío");
    return;
  }

  let mensaje = "🛒 *NUEVO PEDIDO* %0A%0A";

  mensaje += "👤 *Cliente:* " + nombre + "%0A";
  mensaje += "🚚 *Entrega:* " + tipoEntrega + "%0A";
  mensaje += "💳 *Pago:* " + metodoPago + "%0A";

  if(tipoEntrega === "Envío a domicilio"){
    mensaje += "📍 *Dirección:* " + direccion + "%0A";
  }

  mensaje += "%0A📦 *Productos:* %0A";

  let total = 0;

  carrito.forEach(item=>{
    const subtotal = item.precio * item.cantidad;
    total += subtotal;

    mensaje += "• " + item.nombre + 
               " x" + item.cantidad + 
               " - $" + subtotal + "%0A";
  });

  mensaje += "%0A💰 *TOTAL:* $" + total;

  window.open("https://wa.me/528149935887?text=" + mensaje);
}

document.getElementById("tipoEntrega").addEventListener("change", function(){

  const direccionInput = document.getElementById("direccionEnvio");
  const direccionLabel = document.getElementById("direccionLabel");

  if(this.value === "Envío a domicilio"){
    direccionInput.style.display = "block";
    direccionLabel.style.display = "block";
  } else {
    direccionInput.style.display = "none";
    direccionLabel.style.display = "none";
    direccionInput.value = "";
  }

});

renderMenu();
</script>

</body>
</html>
